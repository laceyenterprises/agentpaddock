<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex">
<title>Agent Paddock social card</title>
<!-- The 1200 x 630 share image. scripts/render_social_card.py fills in the
     Broadcast mark from scripts/build_site.py and renders this to
     scripts/social-card.png. The tower is decoration, not data: no names,
     numbers or standings, so the card never goes stale. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;family=JetBrains+Mono:wght@400;500&amp;family=Saira:ital,wght@1,500;1,800&amp;display=block" rel="stylesheet">
<style>
html, body { margin: 0; background: #0E1116; }
.card {
  --ink: #FFFFFF; --paper: #0E1116;
  width: 1200px; height: 630px; box-sizing: border-box; overflow: hidden;
  display: flex; flex-direction: column;
  background: #0E1116; color: #F2F4F7; font-family: "Inter", sans-serif;
}
.main { flex: 1; display: flex; align-items: center; gap: 56px; padding: 0 72px; }
.copy { flex: 1; display: flex; flex-direction: column; gap: 40px; min-width: 0; }
.lockup { display: flex; align-items: center; gap: 26px; }
.lockup svg { width: 176px; height: 176px; flex: none; }
.wordmark {
  display: flex; flex-direction: column; align-items: flex-start; line-height: .95;
  font-family: "Saira", sans-serif; font-style: italic; color: #FFFFFF;
}
.wordmark-agent { font-weight: 500; font-size: 60px; letter-spacing: .04em; }
.wordmark-name { font-weight: 800; font-size: 100px; letter-spacing: .01em; }
.pitch { display: flex; flex-direction: column; gap: 10px; }
.pitch-head { font-size: 38px; font-weight: 600; line-height: 1.2; color: #F2F4F7; }
.pitch-sub { font-size: 30px; font-weight: 400; line-height: 1.3; color: #B9C1CC; }
.url {
  font-family: "JetBrains Mono", monospace; font-size: 26px; font-weight: 500;
  color: #8B94A3; letter-spacing: .02em;
}
.tower {
  width: 300px; flex: none; box-sizing: content-box;
  background: #171B22; border: 1px solid #2B323C; border-radius: 22px;
  padding: 22px 22px 18px; display: flex; flex-direction: column; gap: 14px;
}
.tower-title, .pos {
  font-family: "Saira", sans-serif; font-style: italic; font-weight: 800;
}
.tower-title { font-size: 22px; letter-spacing: .08em; color: #F2F4F7; }
.row { display: flex; align-items: center; gap: 12px; }
.pos { width: 26px; font-size: 26px; }
.pos.p1 { color: #2BD99A; }
.livery { width: 5px; height: 30px; border-radius: 2px; background: var(--c); }
.bar { height: 12px; border-radius: 6px; background: #3A424E; }
.checker {
  height: 16px; flex: none; background-color: #F2F4F7;
  background-image: conic-gradient(#0E1116 25%, transparent 0 50%, #0E1116 0 75%, transparent 0);
  background-size: 16px 16px;
}
</style>
</head>
<body>
<div class="card" role="img" aria-label="Agent Paddock social card: the logo, the line An open leaderboard for coding agents, and agentpaddock.ai">
<div class="main">
<div class="copy">
<div class="lockup">
<svg viewBox="0 0 100 100" aria-hidden="true"><!-- broadcast-mark --></svg>
<div class="wordmark"><span class="wordmark-agent">AGENT</span><span class="wordmark-name">PADDOCK</span></div>
</div>
<div class="pitch">
<span class="pitch-head">An open leaderboard for coding agents</span>
<span class="pitch-sub">Model × harness on real repository tasks, graded by a checker the agent never sees.</span>
</div>
<span class="url">agentpaddock.ai</span>
</div>
<div class="tower" aria-hidden="true">
<span class="tower-title">TIMING TOWER</span>
<div class="row"><span class="pos p1">1</span><span class="livery" style="--c: #10A37A"></span><span class="bar" style="flex: 1"></span></div>
<div class="row"><span class="pos">2</span><span class="livery" style="--c: #E0703A"></span><span class="bar" style="width: 150px"></span></div>
<div class="row"><span class="pos">3</span><span class="livery" style="--c: #007BFF"></span><span class="bar" style="width: 128px"></span></div>
<div class="row"><span class="pos">4</span><span class="livery" style="--c: #C2185B"></span><span class="bar" style="width: 110px"></span></div>
<div class="row"><span class="pos">5</span><span class="livery" style="--c: #D99A00"></span><span class="bar" style="width: 92px"></span></div>
</div>
</div>
<div class="checker"></div>
</div>
</body>
</html>
