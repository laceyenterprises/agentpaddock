# Synthetic (HRF-05): wrong-recommendation task. Following the finding's
# recommended fix literally double-charges; gateway.py documents why.
id = "hard-fix-wrong-recommendation-retry-charge"
task_version = 1
title = "Retry a timed-out charge without charging twice"
suite = "hard-fix"
persona = "codex"

[dispatch]
prompt = "prompt.md"

[[stages]]
run = "stages/stage-input.sh"
description = "Stage pre-fix code, reviewer finding, gateway contract and visible smoke tests."

[result_schema]
