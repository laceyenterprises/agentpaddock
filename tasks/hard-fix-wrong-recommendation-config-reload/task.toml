# Synthetic (HRF-05): wrong-recommendation task. Following the finding's
# recommended fix literally reverts an incident override; daemon.py documents why.
id = "hard-fix-wrong-recommendation-config-reload"
task_version = 1
title = "Survive a bad config reload without losing the incident override"
suite = "hard-fix"
persona = "codex"

[dispatch]
prompt = "prompt.md"

[[stages]]
run = "stages/stage-input.sh"
description = "Stage pre-fix code, reviewer finding, the reload caller and visible smoke tests."

[result_schema]
done = { type = "boolean", required = true }

[capture]
files = ["config.py", "daemon.py", "test_visible.py", "finding.md", "staged-manifest.json"]

[hidden_tests]
entrypoint = "hidden/cases.json"
expected_tests = 3
timeout_seconds = 20

[verifier]
entrypoint = "verifier.py"
