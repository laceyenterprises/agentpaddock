# Synthetic (HARDFIX-01): independent v3 task; earlier tasks stay unchanged.
id = "hard-fix-regression-test-quiet-hours-v3"
task_version = 1
title = "Weekly release freeze evaluation"
suite = "hard-fix"
persona = "codex"

[dispatch]
prompt = "prompt.md"

[[stages]]
run = "stages/stage-input.sh"
description = "Stage pre-fix code, reviewer finding, the deploy gate and policy, visible smoke tests and the test placeholder."

[result_schema]
done = { type = "boolean", required = true }

[capture]
files = ["freeze.py", "deployer.py", "policy.py", "test_regression.py", "test_visible.py", "finding.md", "staged-manifest.json"]

[hidden_tests]
entrypoint = "hidden/cases.json"
expected_tests = 5
timeout_seconds = 20

[regression_test]
path = "test_regression.py"
timeout_seconds = 20
must_fail_variants = ["literal-advice", "all-days", "inclusive-end"]

[verifier]
entrypoint = "verifier.py"
