# Source PR/review: synthetic; authored hard-review fixture for HRX-02.
id = "hard-review-cross-file-v2"
task_version = 2
title = "Cross-file v2: registry change snapshots and a consumer behind a subscriber table"
suite = "hard-review"
persona = "codex"

[dispatch]
prompt = "prompt.md"

[[stages]]
run = "stages/stage-input.sh"
description = "Stage reviewed code, diff and PR context only."

[result_schema]
findings = { type = "list", required = true, max_items = 32, items = { file = { type = "string", required = true }, line_start = { type = "integer", required = true }, line_end = { type = "integer", required = true }, blocking = { type = "boolean", required = true }, summary = { type = "string", required = true }, category = { type = "enum", enum = ["correctness", "concurrency", "data-loss", "security", "error-handling", "resource-leak", "api-contract", "test-gap", "docs"], required = true } } }

[verifier]
entrypoint = "verifier.py"

[about]
what = "Review registry updates and queued event delivery in a version with more indirect dependencies than the base lookup race."
hard = "Connections between components run through configuration and subscriber wiring. The agent must discover those relationships and assess the change across files, where a simple search for direct callers may be insufficient."
