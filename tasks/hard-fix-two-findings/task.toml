# Synthetic (HRF-05): two-findings task. Two review cards, two independent
# defects in two files; fixing one is not enough.
id = "hard-fix-two-findings"
task_version = 1
title = "Credential leak and byte-cap overflow in pager formatting"
suite = "hard-fix"
persona = "codex"

[dispatch]
prompt = "prompt.md"

[[stages]]
run = "stages/stage-input.sh"
description = "Stage pre-fix code, both reviewer findings and visible smoke tests."

[result_schema]
done = { type = "boolean", required = true }

[capture]
files = ["redact.py", "pager.py", "test_visible.py", "finding.md", "staged-manifest.json"]

[hidden_tests]
entrypoint = "hidden/cases.json"
expected_tests = 3
timeout_seconds = 20

[verifier]
entrypoint = "verifier.py"
