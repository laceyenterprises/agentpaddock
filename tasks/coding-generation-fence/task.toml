id = "coding-generation-fence"
task_version = 1
title = "Discriminates async ordering and generation ownership"
suite = "coding"
persona = "claude-code"

[dispatch]
prompt = "prompt.md"

[[stages]]
run = "stages/stage-input.sh"
description = "Stage self-contained synthetic code and deterministic replay."

[result_schema]
fix = { type = "enum", enum = ["pending-empty", "generation-equals-current", "generation-in-pending", "cancel-older-only"] }
original_wrong_schedules = { type = "integer" }
original_trace = { type = "string" }
fixed_trace = { type = "string" }
fixed_wrong_schedules = { type = "integer" }

[verifier]
entrypoint = "verifier.py"
description = "All diagnosis and counterexample fields graded independently with MEG-05 sub-checks."

[about]
what = "Diagnose why a screen can show the wrong result when several background loads finish in different orders."
hard = "Start order and finish order are different. The agent has to follow several possible schedules and distinguish a fix that works once from one that preserves the promised behavior throughout."
