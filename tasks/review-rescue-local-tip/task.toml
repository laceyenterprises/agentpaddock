# Source PR: none public; derived from a private review.
id = "review-rescue-local-tip"
task_version = 3
title = "Provision a rescue from an existing PR branch"
suite = "review"
persona = "codex"

[dispatch]
prompt = "prompt.md"

[[stages]]
run = "stages/stage-input.sh"
description = "Stage reviewed code, diff and PR context only."

[result_schema]
findings = { type = "list", required = true, max_items = 32, items = { file = { type = "string", required = true }, line_start = { type = "integer", required = true }, line_end = { type = "integer", required = true }, blocking = { type = "boolean", required = true }, summary = { type = "string", required = true }, category = { type = "enum", enum = ["correctness", "concurrency", "data-loss", "security", "error-handling", "resource-leak", "api-contract", "test-gap", "docs"], required = true } } }

[verifier]
entrypoint = "verifier.py"

[about]
what = "Review a change that recovers an existing development branch and workspace for further work."
hard = "The code handles several combinations of local state, remote state and active workspace ownership. The agent must reason about preservation of unfinished work across those paths."
