title = "Temporary fetch failure is mistaken for an empty page"
suite = "fix"
persona = "codex"

[dispatch]
prompt = "prompt.md"

[[stages]]
run = "stages/stage-input.sh"
description = "Stage pre-fix code, reviewer finding and visible smoke tests."

[result_schema]
done = { type = "boolean", required = true }

[capture]
files = ["target.py", "support.py", "test_visible.py", "finding.md", "staged-manifest.json"]

[hidden_tests]
