# Synthetic (HRX-03): cross-file task. The finding names one file; its consumer
# reaches the changed function only through a configured plugin spec.
id = "hard-fix-cross-file-v2"
task_version = 1
title = "Directory outage deactivates accounts, through a configured presence check"
suite = "hard-fix"
persona = "codex"

[dispatch]
prompt = "prompt.md"

[[stages]]
run = "stages/stage-input.sh"
description = "Stage pre-fix code, reviewer finding, the directory contract, job configuration and visible smoke tests."

[result_schema]
done = { type = "boolean", required = true }

[capture]
files = ["backend.py", "directory.py", "settings.py", "plugins.py", "reconcile.py", "test_visible.py", "finding.md", "staged-manifest.json"]

[hidden_tests]
entrypoint = "hidden/cases.json"
expected_tests = 3
timeout_seconds = 20

[verifier]
entrypoint = "verifier.py"

[about]
what = "Fix the account-cleanup outage from the base race in a version that selects its lookup through configuration."
hard = "The dependency is indirect, making affected callers harder to discover. The agent must trace configured behavior across files and keep the whole job consistent with its documentation."
