# Synthetic (HRF-05): cross-file task. The finding names one file; the fix
# needs coordinated edits in directory.py and its caller sweep.py.
id = "hard-fix-cross-file"
task_version = 1
title = "Directory outage deactivates accounts, across lookup and sweep"
suite = "hard-fix"
persona = "codex"

[dispatch]
prompt = "prompt.md"

[[stages]]
run = "stages/stage-input.sh"
description = "Stage pre-fix code, reviewer finding, the directory contract and visible smoke tests."

[result_schema]
done = { type = "boolean", required = true }

[capture]
files = ["backend.py", "directory.py", "sweep.py", "test_visible.py", "finding.md", "staged-manifest.json"]

[hidden_tests]
entrypoint = "hidden/cases.json"
expected_tests = 3
timeout_seconds = 20

[verifier]
entrypoint = "verifier.py"

[about]
what = "Fix a review finding about an account-cleanup job that removes active accounts during a directory-service outage."
hard = "The behavior crosses a lookup helper and its caller. Repairing the reported function can change what another part of the program receives, so the agent must follow both contracts together."
