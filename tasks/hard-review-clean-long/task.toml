# Source PR/review: synthetic; authored hard-review clean control for HRF-04. No defects; decoys only (see expected/PROVENANCE.md).
id = "hard-review-clean-long"
task_version = 2
title = "Quiet hours, held-alert digest and dedupe (clean control)"
suite = "hard-review"
persona = "codex"

[dispatch]
prompt = "prompt.md"

[[stages]]
run = "stages/stage-input.sh"
description = "Stage reviewed code, diff and PR context only."

[result_schema]
findings = { type = "list", required = true, max_items = 32, items = { file = { type = "string", required = true }, line_start = { type = "integer", required = true }, line_end = { type = "integer", required = true }, blocking = { type = "boolean", required = true }, summary = { type = "string", required = true }, category = { type = "enum", enum = ["correctness", "concurrency", "data-loss", "security", "error-handling", "resource-leak", "api-contract", "test-gap", "docs"], required = true } } }

[verifier]
entrypoint = "verifier.py"

[about]
what = "Review a substantial change to alert delivery, including quiet hours, grouped notifications and duplicate suppression."
hard = "The change introduces many intentional behavior differences and unfamiliar-looking choices. The agent must assess each concern against the stated requirements and support actionable findings without turning uncertainty into a defect claim."
