# Authored public checkpoint copy. Track-card fields override these individually.
# Exact names win over trailing-* families; challenge entries win over shared ones.
# Keep facts counted. Never copy reasons, answers, locations or planted variant names.

[checks.defect_found]
label = "Find the real defects"
about = "Passes when each real defect in the reviewed change has its own matching blocking finding."

[challenges.hard-review.recall]
label = "Find the real defects"
about = "Passes when the blocking findings cover enough of the change's real defects."

[checks.well_formed_findings]
label = "Submit usable findings"
about = "Passes when every finding has a valid file, line range, blocking flag and category."

[checks.decoy_resistance]
label = "Avoid false alarms"
about = "Passes when the blocking findings stay within the allowance for decoys: tempting code that is actually valid."

[checks.precision]
label = "Keep findings precise"
about = "Passes when blocking findings beyond the real defects, decoys counted separately, stay within the track's allowance."

[checks.category]
label = "Classify the defects"
about = "Passes when each defect that needs a category has a matching finding in that category."

[checks.no_blocking]
label = "Let sound code through"
about = "Passes when the review leaves the clean change free of blocking findings."

[checks.read_evidence]
label = "Show evidence of reading"
about = "Passes when the relevant code files are mentioned in recorded tool arguments before hand-in."

[challenges.review.read_evidence]
label = "Read the reviewed code"
about = "Passes when every designated review file appears in read-like tool arguments or read command segments."

[challenges.hard-review.read_evidence]
label = "Read the reviewed code"
about = "Passes when every designated review file appears in read-like tool arguments or read command segments."

[checks.edited_only_allowed_files]
label = "Respect the edit boundary"
about = "Passes when the captured file set and protected inputs show only changes the task permits."

[checks.hidden_tests_pass]
label = "Pass the hidden tests"
about = "Passes when the captured repair clears the complete hidden test set's defect and regression cases."

[checks.small_diff]
label = "Keep the change focused"
about = "Passes when the required files are present and added and removed lines in editable code stay within the track's change allowance."

[checks."regression_test_fails_on_*"]
label = "Catch a known-wrong version"
about = "Passes when the submitted regression test reports a failure on a faulty implementation, showing it can catch incorrect behaviour."

[checks.regression_test_passes_on_reference]
label = "Accept a correct implementation"
about = "Passes when the submitted regression test accepts a separate correct implementation's behaviour."

[checks.regression_test_passes_on_submission]
label = "Test the submitted repair"
about = "Passes when the submitted regression test and submitted repair work together successfully."

[checks.document_captured]
label = "Hand in the document"
about = "Passes when the edited guide's text was captured for grading."

[checks.document_shape]
label = "Keep document lines bounded"
about = "Passes when every document line fits the document checker's size limit before content checks run."

[checks.known_flags]
label = "Use supported flags"
about = "Passes when option names in the guide introduce no flags unrecognised by the supplied interface."

[checks.known_config_keys]
label = "Use supported configuration keys"
about = "Passes when the guide introduces no keys unrecognised by the supplied interface within the configuration namespaces being checked."

[checks."heading:*"]
label = "Preserve the guide's headings"
about = "Passes when the required existing heading remains a heading in the edited guide."

[checks."stale:*"]
label = "Remove outdated claims"
about = "Passes when the superseded claim no longer appears in the edited guide."

[challenges.rca.root_cause]
label = "Identify the root cause"
about = "Passes when the diagnosis selected from the incident's candidate explanations identifies the underlying cause."

[challenges.rca.evidence]
label = "Cite decisive evidence"
about = "Passes when the submitted evidence identifier cites an incident record that directly supports the root cause."

[challenges.coding.defect_line]
label = "Locate the faulty code"
about = "Passes when the submitted line number points to the accepted location of the fault."

[challenges.coding.terminal_status]
label = "Choose the final status"
about = "Passes when the diagnosis chooses the appropriate terminal classification for the failure described in the task."

[challenges.coding.retryable]
label = "Assess whether retry helps"
about = "Passes when the submitted retryability decision correctly determines whether another attempt can resolve this failure."

[challenges.coding.sentinel_handling]
label = "Handle the sentinel correctly"
about = "Passes when the proposed treatment of the resolver's sentinel value satisfies the resolver's contract."

[challenges.coding.invalid_explicit_still_errors]
label = "Preserve invalid-input handling"
about = "Passes when the diagnosis preserves the resolver's error contract for invalid explicit inputs."

[challenges.coding.fix]
label = "Select the correct repair"
about = "Passes when the repair selected from the task's candidate changes satisfies the supplied behavioural contract."

[challenges.coding.original]
label = "Trace the original replay"
about = "Passes when the predicted trace of the original code matches the supplied replay scenario."

[challenges.coding.tenant_only]
label = "Trace the partial repair"
about = "Passes when the predicted replay follows the task's partial cache-key change through the scenario."

[challenges.coding.fixed_third]
label = "Predict the repaired lookup"
about = "Passes when the requested lookup prediction agrees with the replay after the selected cache repair."

[challenges.coding.fixed_entries]
label = "Count the repaired cache entries"
about = "Passes when the predicted cache size accounts for the distinct entries created by the repaired replay."

[challenges.coding.original_balance]
label = "Predict the original balance"
about = "Passes when the predicted final balance follows the original transaction flow through the scenario's deliveries and failures."

[challenges.coding.reorder_balance]
label = "Evaluate the reordered transaction"
about = "Passes when the predicted balance correctly traces the task's proposed transaction reordering."

[challenges.coding.fixed_balance]
label = "Predict the repaired balance"
about = "Passes when the predicted final balance correctly accounts for the selected repair's transaction behaviour."

[challenges.coding.fixed_receipts]
label = "Count the repaired receipts"
about = "Passes when the predicted receipt count accounts for the receipts left by the repaired replay."

[challenges.coding.original_wrong_schedules]
label = "Count incorrect original schedules"
about = "Passes when the submitted count matches how many completion orders leave the original code showing the wrong final value."

[challenges.coding.original_trace]
label = "Trace the original completions"
about = "Passes when the predicted visible value after each completion follows the original code's publication behaviour in the requested schedule."

[challenges.coding.fixed_trace]
label = "Trace the repaired completions"
about = "Passes when the predicted visible value after each completion follows the selected repair's publication behaviour."

[challenges.coding.fixed_wrong_schedules]
label = "Count incorrect repaired schedules"
about = "Passes when the submitted count matches how many completion orders still end with the wrong visible value after the selected repair."

[challenges.coding.profile]
label = "Resolve the selected profile"
about = "Passes when the diagnosed concrete profile selected by the consumer follows the registry's final bindings after loading."

[challenges.coding.template_limit]
label = "Read the template's initial limit"
about = "Passes when the predicted template limit before requests run resolves the initial value from the complete registry."

[challenges.coding.original_first_tags]
label = "Trace the original request tags"
about = "Passes when the predicted tag count on the first request after the original replay follows the sharing behaviour across both requests."

[challenges.coding.fixed_template_tags]
label = "Trace the repaired template tags"
about = "Passes when the predicted template tag count after the repaired replay follows how the selected repair affects the shared template."
