name: ci

# The repository's only per-PR job, `ci / fast`, and its required check.
# Budget (SPEC R1): one Linux runner, one Python, five minutes, path-filtered,
# pull requests plus pushes to main, superseded runs cancelled. Paid
# evaluations, benchmarks and Docker containment never run in Actions; run
# them locally and submit a run bundle. tests/test_ci_policy.py enforces all of
# this on every PR, and AGENTS.md says why.
#
# The paths cover every tracked top-level entry (the CI-policy test checks
# that), so a PR is never left waiting on a required check that did not run.
on:
  pull_request:
    paths:
      - "*"
      - ".github/**"
      - "batteries/**"
      - "lib/**"
      - "locks/**"
      - "results/**"
      - "scripts/**"
      - "tasks/**"
      - "tests/**"
  push:
    branches: [main]
    paths:
      - "*"
      - ".github/**"
      - "batteries/**"
      - "lib/**"
      - "locks/**"
      - "results/**"
      - "scripts/**"
      - "tasks/**"
      - "tests/**"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  fast:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      # The runner has Docker; the suite must not use it (tests/gym_test_support.py).
      PADDOCK_NO_DOCKER: "1"
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Install the package
        run: |
          python -m pip install -e ".[test]"
          paddock --help > /dev/null
      - name: Publication scan
        run: python scripts/publication_scan.py
      - name: Internal-note guard
        run: python scripts/internal_note_guard.py
      # The fast unit subset: files that run standalone in seconds. Add a test
      # file here when it does; slow corpora and Docker tests stay local.
      - name: Fast unit subset and CI policy
        run: >-
          python -m pytest -q -p no:cacheprovider
          tests/test_ci_policy.py
          tests/test_publication_scan.py
          tests/test_internal_note_guard.py
          tests/test_build_site.py
          tests/test_deploy_skew.py
          tests/test_doc_checks.py
          tests/test_docs_corpus.py
          tests/test_grader.py
          tests/test_hard_review_corpus.py
          tests/test_import_eval_bench.py
          tests/test_injection_corpus.py
          tests/test_leaderboard.py
          tests/test_prompt_submission.py
          tests/test_rca_corpus.py
          tests/test_regenerate_rfd_fix.py
          tests/test_regression_tests.py
          tests/test_regression_variants.py
          tests/test_remediation_references.py
          tests/test_review_checks.py
          tests/test_review_checks_hrf.py
          tests/test_review_checks_rfd_parity.py
          tests/test_review_corpus.py
          tests/test_standalone_source.py
          tests/test_suite.py
          tests/test_task_versions.py
          tests/test_toolcalls.py
