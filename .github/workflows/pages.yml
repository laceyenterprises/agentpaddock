name: pages

# Builds the leaderboard from results/ and deploys it as a Pages artifact
# (SPEC R1): one Linux job, stdlib only, on pushes to main that change the
# results or the site build. workflow_dispatch serves the first deploy. The
# custom domain is a repository setting, so there is no CNAME file here.
on:
  push:
    branches: [main]
    paths:
      - "results/**"
      - "site/**"
      - "scripts/build_site.py"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Build the site from results/
        run: python scripts/build_site.py --out _site
      - uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
