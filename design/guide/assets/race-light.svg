<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="540" viewBox="0 0 1200 540" role="img" aria-label="A race in four sectors."><rect width="1200" height="540" rx="24" fill="#FFFFFF" stroke="#E3E7EC"/><text x="48" y="64" font-family="'JetBrains Mono', ui-monospace, Menlo, monospace" font-size="16" font-weight="500" fill="#626C78" text-anchor="start">TRACK MAP</text><text x="48" y="110" font-family="Saira, 'Arial Narrow', Arial, sans-serif" font-size="40" font-weight="800" font-style="italic" fill="#111111" text-anchor="start">A race in four sectors.</text><rect x="48" y="150" width="544" height="150" rx="18" fill="#F4F6F9"/><g transform="translate(72.0 174.0) scale(2.0000)" fill="none" stroke="#111111" stroke-width="2" stroke-linecap="butt" stroke-linejoin="miter"><rect x="4.5" y="3" width="15" height="18" rx="2"/><path d="M8 7.5h8M8 11h5"/><path d="M8 18c0-2.6 1.8-4 4.5-4H16" style="stroke:#007BFF"/></g><text x="140" y="202" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="24" font-weight="700" fill="#111111" text-anchor="start">1. The briefing</text><text x="140" y="234" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="19" font-weight="400" fill="#4F5761" text-anchor="start">Every entry gets the same task and code,</text><text x="140" y="262" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="19" font-weight="400" fill="#4F5761" text-anchor="start">word for word.</text><rect x="608" y="150" width="544" height="150" rx="18" fill="#F4F6F9"/><g transform="translate(632.0 174.0) scale(2.0000)" fill="none" stroke="#111111" stroke-width="2" stroke-linecap="butt" stroke-linejoin="miter"><path d="M12 1.5a10.5 10.5 0 1 0 .01 0zM12 7a5 5 0 1 1-.01 0z" fill="#111111" fill-rule="evenodd" stroke="none"/><circle cx="12" cy="12" r="7.8" stroke-width="1.6" style="stroke:#007BFF"/><circle cx="12" cy="12" r="1.8" fill="#111111" stroke="none"/></g><text x="700" y="202" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="24" font-weight="700" fill="#111111" text-anchor="start">2. On the track</text><text x="700" y="234" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="19" font-weight="400" fill="#4F5761" text-anchor="start">The model reads, runs and edits with its</text><text x="700" y="262" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="19" font-weight="400" fill="#4F5761" text-anchor="start">tools. Nobody helps it.</text><rect x="48" y="316" width="544" height="150" rx="18" fill="#F4F6F9"/><g transform="translate(72.0 340.0) scale(2.0000)" fill="none" stroke="#111111" stroke-width="2" stroke-linecap="butt" stroke-linejoin="miter"><circle cx="12" cy="13.5" r="7.5"/><path d="M9.5 2.5h5M12 2.5V6M18.2 6.8l1.6-1.6"/><path d="M12 13.5l3.2-3.6" style="stroke:#007BFF"/></g><text x="140" y="368" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="24" font-weight="700" fill="#111111" text-anchor="start">3. The hand-in</text><text x="140" y="400" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="19" font-weight="400" fill="#4F5761" text-anchor="start">It writes its answer to one file and</text><text x="140" y="428" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="19" font-weight="400" fill="#4F5761" text-anchor="start">stops. Nothing more counts.</text><rect x="608" y="316" width="544" height="150" rx="18" fill="#F4F6F9"/><g transform="translate(632.0 340.0) scale(2.0000)" fill="none" stroke="#111111" stroke-width="2" stroke-linecap="butt" stroke-linejoin="miter"><path d="M4 21.5V8M20 21.5V8"/><rect x="2.5" y="3" width="19" height="5"/><path d="M4 18h16" stroke-dasharray="2 2"/><path d="M8.5 12.2l2.5 2.5 4.5-4.5" style="stroke:#007BFF"/></g><text x="700" y="368" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="24" font-weight="700" fill="#111111" text-anchor="start">4. The stewards</text><text x="700" y="400" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="19" font-weight="400" fill="#4F5761" text-anchor="start">Hidden checks grade the answer. Pass them</text><text x="700" y="428" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="19" font-weight="400" fill="#4F5761" text-anchor="start">all: checkered flag.</text><text x="48" y="500" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="20" font-weight="400" fill="#4F5761" text-anchor="start">The answer is never in the car: hidden tests, planted defects and decoys stay outside.</text></svg>
