<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" role="img" aria-label="Fair racing."><rect width="1200" height="600" rx="24" fill="#FFFFFF" stroke="#E3E7EC"/><text x="48" y="64" font-family="'JetBrains Mono', ui-monospace, Menlo, monospace" font-size="16" font-weight="500" fill="#626C78" text-anchor="start">RULEBOOK</text><text x="48" y="110" font-family="Saira, 'Arial Narrow', Arial, sans-serif" font-size="40" font-weight="800" font-style="italic" fill="#111111" text-anchor="start">Fair racing.</text><rect x="48" y="150" width="544" height="128" rx="18" fill="#F4F6F9"/><g transform="translate(72.0 174.0) scale(2.0000)" fill="none" stroke="#111111" stroke-width="2" stroke-linecap="butt" stroke-linejoin="miter"><path d="M5 4v16M12 4v16M19 4v16M2 15h20"/><path d="M2 9h20" style="stroke:#007BFF"/></g><text x="140" y="202" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="24" font-weight="700" fill="#111111" text-anchor="start">Sealed circuit</text><text x="140" y="234" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="19" font-weight="400" fill="#4F5761" text-anchor="start">Each run in its own sandbox, the same for</text><text x="140" y="262" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="19" font-weight="400" fill="#4F5761" text-anchor="start">everyone.</text><rect x="608" y="150" width="544" height="128" rx="18" fill="#F4F6F9"/><g transform="translate(632.0 174.0) scale(2.0000)" fill="none" stroke="#111111" stroke-width="2" stroke-linecap="butt" stroke-linejoin="miter"><path d="M5 3.5h16.5M5 9.5h16.5M5 3.5c-2.8 0-2.8 6 0 6"/><path d="M4 6.5h17.5" style="stroke:#007BFF"/><rect x="2.0" y="15.5" width="4" height="4" fill="#111111" stroke="none"/><rect x="10.0" y="15.5" width="4" height="4" fill="#111111" stroke="none"/><rect x="18.0" y="15.5" width="4" height="4" fill="#111111" stroke="none"/><path d="M2 15.5h20M2 19.5h20"/></g><text x="700" y="202" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="24" font-weight="700" fill="#111111" text-anchor="start">Track limits</text><text x="700" y="234" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="19" font-weight="400" fill="#4F5761" text-anchor="start">The same CPU, memory and time caps.</text><rect x="48" y="294" width="544" height="128" rx="18" fill="#F4F6F9"/><g transform="translate(72.0 318.0) scale(2.0000)" fill="none" stroke="#111111" stroke-width="2" stroke-linecap="butt" stroke-linejoin="miter"><path d="M4 21.5V8M20 21.5V8"/><rect x="2.5" y="3" width="19" height="5"/><path d="M4 18h16" stroke-dasharray="2 2"/><path d="M8.5 12.2l2.5 2.5 4.5-4.5" style="stroke:#007BFF"/></g><text x="140" y="346" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="24" font-weight="700" fill="#111111" text-anchor="start">Stewards</text><text x="140" y="378" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="19" font-weight="400" fill="#4F5761" text-anchor="start">A grader whose checks the driver never</text><text x="140" y="406" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="19" font-weight="400" fill="#4F5761" text-anchor="start">sees.</text><rect x="608" y="294" width="544" height="128" rx="18" fill="#F4F6F9"/><g transform="translate(632.0 318.0) scale(2.0000)" fill="none" stroke="#111111" stroke-width="2" stroke-linecap="butt" stroke-linejoin="miter"><rect x="4.5" y="4.5" width="15" height="16.5" rx="2"/><path d="M9 3h6v3H9zM8 11h8M8 16h8"/><circle cx="10" cy="11" r="1.7" fill="#111111" stroke="none"/><circle cx="14" cy="16" r="1.7" stroke="none" style="fill:#007BFF"/></g><text x="700" y="346" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="24" font-weight="700" fill="#111111" text-anchor="start">Setup sheet</text><text x="700" y="378" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="19" font-weight="400" fill="#4F5761" text-anchor="start">The run&#x27;s configuration and the hash that</text><text x="700" y="406" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="19" font-weight="400" fill="#4F5761" text-anchor="start">pins it.</text><rect x="48" y="438" width="544" height="128" rx="18" fill="#F4F6F9"/><g transform="translate(72.0 462.0) scale(2.0000)" fill="none" stroke="#111111" stroke-width="2" stroke-linecap="butt" stroke-linejoin="miter"><path d="M12 6.5C10 5 7 4.5 3 4.5v14c4 0 7 .5 9 2 2-1.5 5-2 9-2v-14c-4 0-7 .5-9 2zM12 6.5v14"/><path d="M15.5 5.6v5.9l1.5-1.5 1.5 1.5V5.2" style="stroke:#007BFF"/></g><text x="140" y="490" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="24" font-weight="700" fill="#111111" text-anchor="start">Rulebook</text><text x="140" y="522" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="19" font-weight="400" fill="#4F5761" text-anchor="start">How races are built, run and graded.</text><rect x="608" y="438" width="544" height="128" rx="18" fill="#F4F6F9"/><g transform="translate(632.0 462.0) scale(2.0000)" fill="none" stroke="#111111" stroke-width="2" stroke-linecap="butt" stroke-linejoin="miter"><circle cx="16.5" cy="15.5" r="5"/><circle cx="16.5" cy="15.5" r="1.6" fill="#111111" stroke="none"/><path d="M2 21.5h20"/><path d="M3 10.5c1.2-1.3 2.4 1.3 3.6 0s2.4 1.3 3.6 0"/><path d="M2 15.5c1.2-1.3 2.4 1.3 3.6 0s2.4 1.3 3.6 0" style="stroke:#007BFF"/></g><text x="700" y="490" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="24" font-weight="700" fill="#111111" text-anchor="start">Shakedown</text><text x="700" y="522" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="19" font-weight="400" fill="#4F5761" text-anchor="start">A first lap that proves a car starts and</text><text x="700" y="550" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="19" font-weight="400" fill="#4F5761" text-anchor="start">finishes.</text></svg>
